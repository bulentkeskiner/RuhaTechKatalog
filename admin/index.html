<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Giriş — RuhaTech Yönetim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-shell">
  <form class="login-card" id="loginForm" novalidate>
    <div class="login-mark">RT</div>
    <h1>RuhaTech Yönetim Paneli</h1>
    <p class="sub">Devam etmek için giriş yapın.</p>

    <div class="error-box" id="loginError"></div>

    <div class="field">
      <label for="email">E-posta</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Parola</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>

    <button class="btn btn-primary btn-block" type="submit" id="loginBtn">
      <span id="loginBtnText">Giriş Yap</span>
    </button>
  </form>
</div>

<script type="module">
  import { auth } from './js/firebase-init.js';
  import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  const btnText = document.getElementById('loginBtnText');

  onAuthStateChanged(auth, (user) => {
    if (user) window.location.replace('dashboard.html');
  });

  const MESSAGES = {
    'auth/invalid-email': 'Geçersiz e-posta adresi.',
    'auth/user-disabled': 'Bu hesap devre dışı bırakılmış.',
    'auth/user-not-found': 'E-posta veya parola hatalı.',
    'auth/wrong-password': 'E-posta veya parola hatalı.',
    'auth/invalid-credential': 'E-posta veya parola hatalı.',
    'auth/too-many-requests': 'Çok fazla deneme yapıldı. Lütfen biraz sonra tekrar deneyin.',
    'auth/network-request-failed': 'Ağ bağlantısı hatası. İnternetinizi kontrol edin.',
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btnText.innerHTML = '<span class="spinner"></span>';

    try {
      await signInWithEmailAndPassword(auth, email, password);
      // onAuthStateChanged yönlendirmeyi yapacak.
    } catch (err) {
      errorBox.textContent = MESSAGES[err.code] || 'Giriş yapılamadı. Lütfen tekrar deneyin.';
      errorBox.classList.add('show');
      btn.disabled = false;
      btnText.textContent = 'Giriş Yap';
    }
  });
</script>
</body>
</html>
